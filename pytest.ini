[pytest]
# Pytest configuration for Production NLP Pipeline

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --maxfail=5
    --cov=src/application
    --cov=src/domain
    --cov=src/infrastructure
    --cov=src/shared
    --cov-report=term-missing
    # --cov-report=html:htmlcov
    --cov-fail-under=78

# Asyncio mode for pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    forms: Tests for form system
    session: Tests for session management
    policy: Tests for policy engine
    ner: Tests for named entity recognition
    hooks: Tests for hooks system
    slow: Tests that take significant time to run
    bengali: Tests with Bengali text queries

# Coverage options
[coverage:run]
source =
    src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
